# ===================================================================
# ORDER SERVICE TEST ENVIRONMENT CONFIGURATION
# ===================================================================

# Application Information
spring.application.name=order-service
server.port=8082
application.environment=test

# Database Configuration - Using H2 in-memory database for tests
spring.datasource.url=jdbc:h2:mem:orderdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver
spring.h2.console.enabled=true

# JPA/Hibernate Configuration
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.use_sql_comments=true

# Service Connection Properties (Mocked in Tests)
product-service.url=http://localhost:8081
product-service.connect-timeout=500
product-service.read-timeout=1000

payment-service.url=http://localhost:8083
payment-service.connect-timeout=500
payment-service.read-timeout=1000

notification-service.url=http://localhost:8084
notification-service.connect-timeout=500
notification-service.read-timeout=1000

# Order Service Specific Configuration
order-service.cart-timeout-hours=24
order-service.minimum-order-amount=10.00
order-service.maximum-order-items=50
order-service.default-shipping-cost=5.99
order-service.free-shipping-threshold=75.00

# Feature Flags for Testing
feature.send-order-notifications=false
feature.auto-cancel-pending-orders=false
feature.validate-inventory=true

# Logging Configuration
logging.level.root=INFO
logging.level.com.gradlemedium100.orderservice=DEBUG
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE

# Cache Configuration
spring.cache.type=NONE

# Scheduled Tasks Configuration - Disabled in Tests
order-service.scheduled-tasks.enabled=false

# Test-Specific Settings
test.mock-external-services=true
test.data.generate-sample-orders=true
test.data.sample-orders-count=5
test.data.sample-users-count=3

# REST Controller Test Settings
spring.mvc.throw-exception-if-no-handler-found=true