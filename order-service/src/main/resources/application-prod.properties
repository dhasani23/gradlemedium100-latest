# ===================================================================
# Order Service - Production Environment Configuration
# ===================================================================
# Production configuration properties for OrderService module

# ===================================================================
# Production Deployment Settings
# ===================================================================
# Disable development features
spring.devtools.restart.enabled=false
spring.devtools.livereload.enabled=false

# Optimize server settings for production
server.tomcat.max-threads=200
server.tomcat.max-connections=10000
server.tomcat.accept-count=100
server.tomcat.connection-timeout=5000

# ===================================================================
# Production Database Configuration
# ===================================================================
# Production database connection settings
spring.datasource.url=jdbc:postgresql://order-db.gradlemedium100.com:5432/orderdb
spring.datasource.driverClassName=org.postgresql.Driver
spring.datasource.username=${ORDER_DB_USERNAME}
spring.datasource.password=${ORDER_DB_PASSWORD}

# Connection pool settings
spring.datasource.hikari.maximum-pool-size=20
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.idle-timeout=30000
spring.datasource.hikari.connection-timeout=20000

# JPA production settings
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# ===================================================================
# Production Logging Configuration
# ===================================================================
# Focused production logging
logging.level.com.gradlemedium100.orderservice=INFO
logging.level.org.springframework=WARN
logging.level.org.hibernate=WARN

# Log file configuration
logging.file.name=/var/log/gradlemedium100/order-service.log
logging.pattern.file=%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n
logging.logback.rollingpolicy.max-file-size=10MB
logging.logback.rollingpolicy.max-history=30

# ===================================================================
# Production Service Integration
# ===================================================================
# Production service endpoints
product-service.url=https://product-service.gradlemedium100.com/api/products
payment-service.url=https://payment-service.gradlemedium100.com/api/payments
notification-service.url=https://notification-service.gradlemedium100.com/api/notifications

# Production timeouts (milliseconds)
product-service.timeout=3000
payment-service.timeout=5000
notification-service.timeout=2000

# Disable mocking in production
mock.external-services=false

# ===================================================================
# Production Cache Configuration
# ===================================================================
# Enhanced caching for production
spring.cache.type=redis
spring.redis.host=redis.gradlemedium100.com
spring.redis.port=6379
spring.redis.password=${REDIS_PASSWORD}
spring.redis.timeout=2000

# Order cache settings optimized for production load
order.cache.enabled=true
order.cache.max-size=1000
order.cache.expire-after-write=600

# Cart cache settings optimized for production load
cart.cache.enabled=true
cart.cache.max-size=500
cart.cache.expire-after-write=120

# ===================================================================
# Production Security Settings
# ===================================================================
# Enforce HTTPS
server.ssl.enabled=true
server.ssl.key-store=/etc/ssl/gradlemedium100/orderservice.p12
server.ssl.key-store-password=${SSL_KEYSTORE_PASSWORD}
server.ssl.key-store-type=PKCS12
server.ssl.key-alias=orderservice

# Security headers
security.require-ssl=true
server.tomcat.remote-ip-header=x-forwarded-for
server.tomcat.protocol-header=x-forwarded-proto

# ===================================================================
# Production Monitoring & Management
# ===================================================================
# Restrict management endpoints
management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.show-details=never
management.endpoint.health.probes.enabled=true
management.health.livenessState.enabled=true
management.health.readinessState.enabled=true

# ===================================================================
# Production Feature Flags
# ===================================================================
# Disable development/testing features
order.sample-data.enabled=false

# Enable production features
order.validation.enabled=true
order.status-transition-validation.enabled=true

# ===================================================================
# Production Business Rules
# ===================================================================
# Standard business rules for orders
order.minimum-amount=10.00
order.maximum-items=100
order.cancellation-window-days=1
order.auto-cancel-unpaid-hours=24

# Standard business rules for carts
cart.maximum-items=100
cart.timeout-hours=72
cart.item.max-quantity=20

# ===================================================================
# Production Performance Optimizations
# ===================================================================
# Enable response compression
server.compression.enabled=true
server.compression.mime-types=application/json,application/xml,text/html,text/xml,text/plain
server.compression.min-response-size=2048

# Scheduled task thread pool
spring.task.scheduling.pool.size=5
spring.task.scheduling.thread-name-prefix=scheduled-

# Batch processing settings
spring.batch.job.enabled=false
order.batch.process-size=100

# ===================================================================
# Circuit Breaker Configuration
# ===================================================================
resilience4j.circuitbreaker.instances.productService.sliding-window-size=10
resilience4j.circuitbreaker.instances.productService.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.paymentService.sliding-window-size=10
resilience4j.circuitbreaker.instances.paymentService.failure-rate-threshold=50

# ===================================================================
# Rate Limiting
# ===================================================================
resilience4j.ratelimiter.instances.orderApi.limit-for-period=100
resilience4j.ratelimiter.instances.orderApi.limit-refresh-period=1s
resilience4j.ratelimiter.instances.orderApi.timeout-duration=500ms

