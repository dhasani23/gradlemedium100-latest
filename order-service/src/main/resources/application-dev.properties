# ===================================================================
# Order Service - Development Environment Configuration
# ===================================================================
# Configuration properties for OrderService module in development environment

# ===================================================================
# Spring Development Configuration
# ===================================================================
# Enable Spring dev tools for hot reloading
spring.devtools.restart.enabled=true
spring.devtools.livereload.enabled=true

# Show SQL for debugging
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Pretty print JSON responses
spring.jackson.serialization.indent-output=true

# ===================================================================
# Development Database Configuration
# ===================================================================
# Use H2 in-memory database for development
spring.datasource.url=jdbc:h2:mem:orderdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Initialize database with sample data
spring.jpa.hibernate.ddl-auto=create-drop
spring.sql.init.mode=always

# ===================================================================
# Development Logging Configuration
# ===================================================================
# More detailed logging in development
logging.level.com.gradlemedium100.orderservice=DEBUG
logging.level.org.springframework=INFO
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE

# ===================================================================
# Development Service Integration
# ===================================================================
# Local service endpoints for development
product-service.url=http://localhost:8082/api/products
payment-service.url=http://localhost:8084/api/payments
notification-service.url=http://localhost:8085/api/notifications

# Enable mock services for development
mock.external-services=true

# ===================================================================
# Development Feature Flags
# ===================================================================
# Enable more features in development
order.validation.enabled=true
order.sample-data.enabled=true
order.sample-data.count=50

# ===================================================================
# Development Cache Configuration
# ===================================================================
# Disable or reduce caching during development
spring.cache.type=simple
order.cache.enabled=false
cart.cache.enabled=false

# ===================================================================
# Development Monitoring
# ===================================================================
# Enable all actuator endpoints for development
management.endpoints.web.exposure.include=*
management.endpoint.health.show-details=always

# ===================================================================
# Development Business Rules
# ===================================================================
# Lower thresholds for easier testing
order.minimum-amount=0.01
cart.timeout-hours=24
order.auto-cancel-unpaid-hours=1

# ===================================================================
# Development Debugging Options
# ===================================================================
# Debug mode for REST controllers
logging.level.org.springframework.web=DEBUG
# Enable request/response logging
logging.level.org.springframework.web.filter.CommonsRequestLoggingFilter=DEBUG

# ===================================================================
# Development Security Configuration
# ===================================================================
# Disable CSRF in development for easier testing
spring.security.csrf.enabled=false
# Allow frames for H2 console
spring.security.headers.frame=false

# ===================================================================
# Additional Development Settings
# ===================================================================
# Increase timeout for remote debugging sessions
spring.mvc.async.request-timeout=300000

