# ===================================================================
# Order Service Application Properties
# ===================================================================
# Configuration properties for the OrderService module 

# ===================================================================
# Spring Application Configuration
# ===================================================================
spring.application.name=order-service
server.port=8083
server.servlet.context-path=/api/orders

# Include other configuration profiles
spring.profiles.include=dataaccess,security

# ===================================================================
# Database Connection (Inherits most settings from data-access module)
# ===================================================================
# Override specific database settings for order service if needed
spring.jpa.properties.hibernate.default_schema=order

# ===================================================================
# Caching Configuration
# ===================================================================
# Enable caching
spring.cache.type=caffeine
# Default cache TTL
spring.cache.caffeine.spec=maximumSize=500,expireAfterWrite=600s

# Order cache settings
order.cache.enabled=true
order.cache.max-size=200
order.cache.expire-after-write=300
# Cart cache settings - shorter expiry due to frequent updates
cart.cache.enabled=true
cart.cache.max-size=100
cart.cache.expire-after-write=60

# ===================================================================
# REST API Configuration
# ===================================================================
# Pagination defaults
api.pagination.default-page-size=20
api.pagination.max-page-size=100

# ===================================================================
# Order Configuration
# ===================================================================
# Minimum amount for an order to be valid
order.minimum-amount=10.00
# Maximum number of items allowed in an order
order.maximum-items=50
# Time window (in days) for order cancellation
order.cancellation-window-days=1
# Auto-cancel unpaid orders after (in hours)
order.auto-cancel-unpaid-hours=24
# Enable order notifications
order.notifications.enabled=true

# ===================================================================
# Cart Configuration
# ===================================================================
# Maximum number of items allowed in a cart
cart.maximum-items=50
# Time (in hours) after which a cart is considered abandoned
cart.timeout-hours=72
# Schedule for abandoned cart cleanup (every day at 2 AM)
cart.cleanup.cron=0 0 2 * * ?
# Maximum quantity of the same item in a cart
cart.item.max-quantity=10

# ===================================================================
# Logging Configuration
# ===================================================================
# Set logging levels
logging.level.com.gradlemedium100.orderservice=INFO
logging.level.org.springframework.cache=INFO

# ===================================================================
# Management & Monitoring
# ===================================================================
# Enable metrics for order operations
management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.show-details=when_authorized
management.health.defaults.enabled=true

# ===================================================================
# Integration Configuration
# ===================================================================
# Product Service integration
product-service.url=http://product-service:8082/api/products
product-service.timeout=5000
# Payment Service integration
payment-service.url=http://payment-service:8084/api/payments
payment-service.timeout=10000
# Notification Service integration
notification-service.url=http://notification-service:8085/api/notifications
notification-service.timeout=3000

# ===================================================================
# Business Rules Configuration
# ===================================================================
# Enable order validation
order.validation.enabled=true
# Enable order status transition validation
order.status-transition-validation.enabled=true
# Valid status transitions (from:to,to,to;from:to...)
order.valid-status-transitions=CREATED:PAYMENT_PENDING,CANCELED;PAYMENT_PENDING:PAYMENT_CONFIRMED,CANCELED;PAYMENT_CONFIRMED:PROCESSING,CANCELED,REFUNDED;PROCESSING:SHIPPED,CANCELED,REFUNDED;SHIPPED:DELIVERED,REFUNDED

# ===================================================================
# Development Settings (disable in production)
# ===================================================================
# Enable mock external services for local development
mock.external-services=false
# Enable initialization of sample data
order.sample-data.enabled=true
# Number of sample orders to generate
order.sample-data.count=20

