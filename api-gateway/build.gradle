/*
 * Build file for the ApiGateway module
 * 
 * This API Gateway serves as the entry point for the application,
 * routing requests to appropriate services. It handles request filtering,
 * rate limiting, and API documentation integration.
 */

plugins {
    id 'org.springframework.boot' version '2.7.17'
    id 'io.spring.dependency-management' version '1.0.15.RELEASE'
    id 'java'
}

group = 'com.gradlemedium100'
version = '0.1.0'

java {
    sourceCompatibility = JavaVersion.VERSION_17
    targetCompatibility = JavaVersion.VERSION_17
}

repositories {
    mavenCentral()
    maven { 
        url = 'https://repo.spring.io/milestone' 
    }
}

ext {
    set('springCloudVersion', "2021.0.8")
}

dependencies {
    // Spring Boot and Cloud dependencies
    implementation 'org.springframework.boot:spring-boot-starter-actuator'
    implementation 'org.springframework.boot:spring-boot-starter-webflux'
    implementation 'org.springframework.cloud:spring-cloud-starter-gateway'
    implementation 'org.springframework.cloud:spring-cloud-starter-netflix-eureka-client'
    implementation 'org.springframework.cloud:spring-cloud-starter-config'
    implementation 'org.springframework.cloud:spring-cloud-starter-circuitbreaker-reactor-resilience4j'
    implementation 'org.springframework.boot:spring-boot-starter-data-redis-reactive'

    // API Documentation
    implementation 'io.springfox:springfox-boot-starter:3.0.0'
    implementation 'io.springfox:springfox-swagger-ui:3.0.0'
    implementation 'org.springdoc:springdoc-openapi-webflux-ui:1.6.15'

    // Logging
    implementation 'org.slf4j:slf4j-api'
    
    // Internal module dependencies
    implementation project(':common')
    implementation project(':security')
    
    // Testing dependencies
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'io.projectreactor:reactor-test'
    testImplementation 'org.mockito:mockito-core'
    testImplementation 'org.mockito:mockito-junit-jupiter'
}

dependencyManagement {
    imports {
        mavenBom "org.springframework.cloud:spring-cloud-dependencies:${springCloudVersion}"
    }
}

test {
    useJUnitPlatform()
}

// Package configuration
bootJar {
    archiveBaseName = 'api-gateway'
    archiveVersion = project.version
    mainClass = 'com.gradlemedium100.apigateway.ApiGatewayApplication'
}

// Configure SpringBoot main class
springBoot {
    mainClass = 'com.gradlemedium100.apigateway.ApiGatewayApplication'
}

// This task runs tests before the build
tasks.build.dependsOn test

// Add a custom task to compile with deprecation warnings
tasks.withType(JavaCompile) {
    options.compilerArgs << "-Xlint:deprecation"
}

// FIXME: Add integration test setup with Docker for dependent services

// TODO: Configure more specific rate limiting settings for different API endpoints

/*
 * Custom task to check and report dependencies
 * Useful for monitoring outdated dependencies
 */
task checkDependencies {
    doLast {
        println "Checking dependencies for the API Gateway module..."
        // Placeholder for dependency checking logic
    }
}

/*
 * Custom task for API Gateway specific documentation generation
 */
task generateApiDocs(type: JavaExec) {
    description = 'Generates the API documentation for all services'
    group = 'documentation'
    
    mainClass = 'com.gradlemedium100.apigateway.documentation.ApiDocGenerator'
    classpath = sourceSets.main.runtimeClasspath
    
    // TODO: Configure documentation output parameters
}