# Security Module Configuration for Gradle Medium 100
# This file contains configuration properties related to JWT, authentication and security parameters

# ===================================================================
# JWT Configuration
# ===================================================================
# Secret key for signing JWT tokens (should be moved to environment variables in production)
security.jwt.secret-key=404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970
# Token validity duration in milliseconds (default: 24 hours)
security.jwt.expiration=86400000
# Refresh token validity duration in milliseconds (default: 7 days)
security.jwt.refresh-token.expiration=604800000
# Token issuer name
security.jwt.issuer=gradlemedium100

# ===================================================================
# Spring Security Configuration
# ===================================================================
# Disable Spring Security's default login form
spring.security.basic.enabled=false
# Session management policy (STATELESS for REST APIs using JWT)
spring.security.session-creation-policy=STATELESS

# ===================================================================
# Authentication Configuration
# ===================================================================
# Maximum login attempts before account lockout
security.authentication.max-attempts=5
# Account lockout duration in seconds
security.authentication.lockout-duration=300
# Remember-me cookie validity period in seconds (30 days)
security.remember-me.validity-seconds=2592000
# Remember-me cookie name
security.remember-me.cookie-name=GRADLEMEDIUM100_REMEMBER_ME

# ===================================================================
# Password Policy
# ===================================================================
# Minimum password length
security.password.min-length=8
# Require at least one uppercase letter
security.password.require-uppercase=true
# Require at least one lowercase letter
security.password.require-lowercase=true
# Require at least one digit
security.password.require-digit=true
# Require at least one special character
security.password.require-special-char=true
# Password expiration time in days (0 means never expire)
security.password.expiration-days=90

# ===================================================================
# CORS Configuration
# ===================================================================
# Allowed origins (comma-separated list)
security.cors.allowed-origins=http://localhost:3000,http://localhost:8080
# Allowed methods
security.cors.allowed-methods=GET,POST,PUT,DELETE,OPTIONS
# Allowed headers
security.cors.allowed-headers=Authorization,Content-Type,X-Requested-With,Accept
# Allow credentials
security.cors.allow-credentials=true
# Max age in seconds
security.cors.max-age=3600

# ===================================================================
# Public Endpoints (no authentication required)
# ===================================================================
security.public-endpoints=/api/auth/**,/api/public/**,/actuator/health,/v3/api-docs/**,/swagger-ui/**,/swagger-ui.html

# ===================================================================
# Role-based Access Control
# ===================================================================
# Admin endpoints access
security.role-endpoints.admin=/api/admin/**,/api/management/**
# User endpoints access
security.role-endpoints.user=/api/user/**,/api/profile/**

# ===================================================================
# Audit Configuration
# ===================================================================
# Enable security auditing
security.audit.enabled=true
# Audit log file path
security.audit.log-path=logs/security-audit.log
# Events to audit (login, logout, failed-login, etc.)
security.audit.events=LOGIN_SUCCESS,LOGIN_FAILURE,LOGOUT,TOKEN_REFRESH,PASSWORD_CHANGE

# ===================================================================
# Session Management
# ===================================================================
# Maximum concurrent sessions per user (0 means unlimited)
security.session.max-concurrent-sessions=1
# Whether to prevent login when max sessions are reached
security.session.prevent-login=true

