plugins {
    id 'java-library'
    id 'org.springframework.boot' version '2.7.17'
    id 'io.spring.dependency-management' version '1.0.15.RELEASE'
}

description = 'Common module containing utilities, exceptions, DTOs, and shared constants'

bootJar {
    enabled = false
}

jar {
    enabled = true
    archiveClassifier = ''
}

java {
    sourceCompatibility = JavaVersion.VERSION_17
    targetCompatibility = JavaVersion.VERSION_17
}

repositories {
    mavenCentral()
}

dependencies {
    // Spring Boot dependencies
    api 'org.springframework.boot:spring-boot-starter'
    api 'org.springframework.boot:spring-boot-starter-validation'
    api 'org.springframework.boot:spring-boot-starter-logging'
    
    // Added Spring Web for HTTP classes and REST annotations
    api 'org.springframework.boot:spring-boot-starter-web'
    
    // Added Spring Data for Pagination support
    api 'org.springframework.boot:spring-boot-starter-data-jpa'
    
    // Jackson for JSON processing
    api 'com.fasterxml.jackson.core:jackson-databind'
    api 'com.fasterxml.jackson.datatype:jackson-datatype-jsr310' // Added Java 8 DateTime support
    
    // Validation
    api 'javax.validation:validation-api:2.0.1.Final'
    
    // Apache Commons
    api 'org.apache.commons:commons-lang3:3.12.0'
    
    // Logging
    api 'org.slf4j:slf4j-api'
    api 'ch.qos.logback:logback-classic'
    
    // Test dependencies
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.junit.jupiter:junit-jupiter-api'
    testRuntimeOnly 'org.junit.jupiter:junit-jupiter-engine'
    testImplementation 'org.mockito:mockito-junit-jupiter'
}

test {
    useJUnitPlatform()
}

tasks.withType(JavaCompile) {
    options.encoding = 'UTF-8'
}

// Create javadoc JAR
task javadocJar(type: Jar) {
    archiveClassifier = 'javadoc'
    from javadoc.destinationDir
}

// Create sources JAR
task sourcesJar(type: Jar) {
    archiveClassifier = 'sources'
    from sourceSets.main.allJava
}

artifacts {
    archives javadocJar
    archives sourcesJar
}