plugins {
    id 'java-library'
    id 'org.springframework.boot' version '2.5.0'
    id 'io.spring.dependency-management' version '1.0.11.RELEASE'
}

description = 'Common module containing utilities, exceptions, DTOs, and shared constants'

bootJar {
    enabled = false
}

jar {
    enabled = true
    archiveClassifier = ''
}

java {
    sourceCompatibility = JavaVersion.VERSION_1_8
    targetCompatibility = JavaVersion.VERSION_1_8
}

repositories {
    mavenCentral()
}

dependencies {
    // Spring Boot dependencies
    api 'org.springframework.boot:spring-boot-starter:2.5.0'
    api 'org.springframework.boot:spring-boot-starter-validation:2.5.0'
    api 'org.springframework.boot:spring-boot-starter-logging:2.5.0'
    
    // Added Spring Web for HTTP classes and REST annotations
    api 'org.springframework.boot:spring-boot-starter-web:2.5.0'
    
    // Added Spring Data for Pagination support
    api 'org.springframework.boot:spring-boot-starter-data-jpa:2.5.0'
    
    // Jackson for JSON processing
    api 'com.fasterxml.jackson.core:jackson-databind:2.12.3'
    api 'com.fasterxml.jackson.datatype:jackson-datatype-jsr310:2.12.3' // Added Java 8 DateTime support
    
    // Validation
    api 'javax.validation:validation-api:2.0.1.Final'
    
    // Apache Commons
    api 'org.apache.commons:commons-lang3:3.12.0'
    
    // Logging
    api 'org.slf4j:slf4j-api:1.7.30'
    api 'ch.qos.logback:logback-classic:1.2.3'
    
    // Test dependencies
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.junit.jupiter:junit-jupiter-api'
    testRuntimeOnly 'org.junit.jupiter:junit-jupiter-engine'
    testImplementation 'org.mockito:mockito-junit-jupiter:3.11.2' // Added Mockito with JUnit 5 support
}

test {
    useJUnitPlatform()
}

tasks.withType(JavaCompile) {
    options.encoding = 'UTF-8'
}

// Create javadoc JAR
task javadocJar(type: Jar) {
    archiveClassifier = 'javadoc'
    from javadoc.destinationDir
}

// Create sources JAR
task sourcesJar(type: Jar) {
    archiveClassifier = 'sources'
    from sourceSets.main.allJava
}

artifacts {
    archives javadocJar
    archives sourcesJar
}