# validation-messages.properties
# Contains validation messages for error responses used throughout the application
# These messages can be referenced using {key} in validation annotations

# General validation messages
validation.general.required=This field is required
validation.general.notNull=Must not be null
validation.general.notBlank=Must not be blank or empty
validation.general.notEmpty=Must not be empty
validation.general.invalidValue=Invalid value provided
validation.general.internalError=An internal error occurred

# String validation messages
validation.string.length=Length must be between {min} and {max} characters
validation.string.minLength=Minimum length is {min} characters
validation.string.maxLength=Maximum length is {max} characters
validation.string.pattern=Format is invalid
validation.string.invalidChars=Contains invalid characters

# Number validation messages
validation.number.range=Value must be between {min} and {max}
validation.number.min=Must be greater than or equal to {value}
validation.number.max=Must be less than or equal to {value}
validation.number.positive=Must be a positive number
validation.number.negative=Must be a negative number
validation.number.integer=Must be an integer value

# Date validation messages
validation.date.past=Date must be in the past
validation.date.future=Date must be in the future
validation.date.format=Invalid date format, expected: {format}
validation.date.range=Date must be between {start} and {end}

# Email validation messages
validation.email.format=Invalid email address format
validation.email.domain=Email domain is not allowed

# Phone validation messages
validation.phone.format=Invalid phone number format
validation.phone.countryCode=Invalid country code

# Common field validation messages
validation.field.id=Invalid identifier format
validation.field.name=Invalid name format
validation.field.description=Description is too long
validation.field.pageSize=Page size must be between 1 and {max}
validation.field.pageNumber=Page number must be 0 or greater
validation.field.sortDirection=Sort direction must be 'ASC' or 'DESC'

# Resource-specific validation messages
validation.resource.notFound={resourceType} with ID {resourceId} not found
validation.resource.alreadyExists={resourceType} with this ID already exists
validation.resource.invalidState={resourceType} is in an invalid state for this operation

# Security validation messages
validation.security.unauthorized=Unauthorized access
validation.security.forbidden=Access to this resource is forbidden
validation.security.invalidToken=Invalid or expired authentication token
validation.security.invalidCredentials=Invalid username or password

# Business logic validation messages
validation.business.invalidOperation=Operation cannot be performed in current state
validation.business.insufficientFunds=Insufficient funds for this operation
validation.business.duplicateRequest=Duplicate request detected
validation.business.processingError=Error processing request

# Custom validation types (used in ValidationUtils)
validation.custom.alphanumeric=Must contain only letters and numbers
validation.custom.password=Password must contain at least 8 characters including one uppercase letter, one lowercase letter, one number, and one special character
validation.custom.uuid=Must be a valid UUID format
validation.custom.zipCode=Invalid postal/zip code format
validation.custom.ipAddress=Invalid IP address format
validation.custom.url=Invalid URL format