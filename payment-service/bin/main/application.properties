# Payment Service Application Configuration
spring.application.name=payment-service

# Server Configuration
server.port=8083
server.servlet.context-path=/api/payments

# Database Configuration
spring.datasource.url=jdbc:h2:mem:paymentdb
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=payment_user
spring.datasource.password=payment_pass
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.h2.console.settings.web-allow-others=false

# JPA Configuration
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Logging Configuration
logging.level.root=INFO
logging.level.com.gradlemedium100.payment=DEBUG
logging.level.org.springframework.security=INFO
logging.level.org.springframework.transaction=INFO
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE

# Security Configuration
spring.security.user.name=payment_admin
spring.security.user.password=secure_payment_pass
security.jwt.token.secret-key=${JWT_SECRET:defaultsecretkey}
security.jwt.token.expire-length=3600000

# Payment Gateway Configuration
payment.gateway.url=https://api.payment-gateway.com/v1
payment.gateway.api-key=${PAYMENT_GATEWAY_API_KEY:demo_key}
payment.gateway.api-secret=${PAYMENT_GATEWAY_API_SECRET:demo_secret}
payment.gateway.timeout=30000
payment.gateway.provider=stripe

# Payment Processing Configuration
payment.transaction.timeout=60000
payment.retry.max-attempts=3
payment.retry.backoff-period=2000

# Encryption Configuration
encryption.algorithm=AES/GCM/NoPadding
encryption.key=${ENCRYPTION_KEY:default_encryption_key_for_development}

# Cross-Origin Resource Sharing
cors.allowed-origins=http://localhost:3000,https://gradlemedium100.com
cors.allowed-methods=GET,POST,PUT,DELETE,OPTIONS
cors.allowed-headers=Authorization,Content-Type,X-Requested-With

# Actuator Configuration
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=when_authorized

# Connection to other services
order-service.url=http://order-service:8081/api/orders
notification-service.url=http://notification-service:8084/api/notifications

# Temporary storage for failed transactions
payment.failed-transactions.directory=/tmp/payment-service/failed-transactions

