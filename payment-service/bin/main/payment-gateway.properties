# Payment Gateway Configuration
# These properties are used by PaymentGatewayConfig

# API Key (encrypted)
payment.gateway.api.key=encrypted_api_key_placeholder

# API Secret (encrypted)
payment.gateway.api.secret=encrypted_api_secret_placeholder

# Gateway URL
payment.gateway.url=https://api.example-payment-gateway.com/v1

# Connection Timeouts
payment.gateway.timeout.connect=30000
payment.gateway.timeout.read=60000

# Retry Configuration
payment.gateway.retry.max=3
payment.gateway.retry.delay=1000

# Transaction Limits
payment.gateway.limit.min=0.50
payment.gateway.limit.max=10000.00

# Webhook Configuration
payment.gateway.webhook.url=https://your-app.com/api/payment/webhook
payment.gateway.webhook.secret=webhook_secret_placeholder