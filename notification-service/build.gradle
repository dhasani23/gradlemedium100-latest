plugins {
    id 'java'
    id 'org.springframework.boot' version '2.7.17'
    id 'io.spring.dependency-management' version '1.0.15.RELEASE'
}

description = 'Notification service module that manages email, SMS, and in-app notifications'

java {
    sourceCompatibility = JavaVersion.VERSION_17
    targetCompatibility = JavaVersion.VERSION_17
}

repositories {
    mavenCentral()
}

dependencies {
    // Internal module dependencies
    implementation project(':common')
    implementation project(':data-access')
    implementation project(':security')
    
    // Spring Boot dependencies
    implementation 'org.springframework.boot:spring-boot-starter'
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-mail'
    
    // Templating engines
    implementation 'org.springframework.boot:spring-boot-starter-thymeleaf'
    implementation 'org.freemarker:freemarker:2.3.32'
    
    // SMS service integration (example)
    implementation 'com.twilio.sdk:twilio:9.9.1'
    
    // JSON handling
    implementation 'com.fasterxml.jackson.core:jackson-databind'
    
    // Validation
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    
    // Logging
    implementation 'org.slf4j:slf4j-api'
    
    // Test dependencies
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.junit.jupiter:junit-jupiter-api'
    testImplementation 'org.mockito:mockito-core'
    testImplementation 'org.mockito:mockito-junit-jupiter'
    testRuntimeOnly 'org.junit.jupiter:junit-jupiter-engine'
}

test {
    useJUnitPlatform()
}

tasks.withType(JavaCompile) {
    options.encoding = 'UTF-8'
}

// Optional: create an executable JAR if this service should be deployable standalone
bootJar {
    enabled = true
    archiveBaseName = 'notification-service'
    archiveVersion = '0.1.0-SNAPSHOT'
    mainClass = 'com.gradlemedium100.notification.NotificationServiceApplication'
}

// Create javadoc JAR
task javadocJar(type: Jar) {
    archiveClassifier = 'javadoc'
    from javadoc.destinationDir
}

// Create sources JAR
task sourcesJar(type: Jar) {
    archiveClassifier = 'sources'
    from sourceSets.main.allJava
}

artifacts {
    archives javadocJar
    archives sourcesJar
}

// Configure SpringBoot main class
springBoot {
    mainClass = 'com.gradlemedium100.notification.NotificationServiceApplication'
}