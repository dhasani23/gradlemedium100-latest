# Application DataAccess Properties
# Configuration for database connections and JPA settings

# Database Connection Settings
spring.datasource.url=jdbc:postgresql://localhost:5432/gradlemedium100
spring.datasource.username=postgres
spring.datasource.password=postgres
spring.datasource.driver-class-name=org.postgresql.Driver

# Connection Pool Configuration (HikariCP)
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.connection-timeout=20000

# JPA/Hibernate Properties
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.jdbc.batch_size=25
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true

# Flyway Migration Configuration
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true
spring.flyway.validate-on-migrate=true
spring.flyway.table=schema_version

# H2 Database Configuration (for development/testing)
# Uncomment these properties to use H2 instead of PostgreSQL
#spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1
#spring.datasource.driver-class-name=org.h2.Driver
#spring.datasource.username=sa
#spring.datasource.password=
#spring.h2.console.enabled=true
#spring.h2.console.path=/h2-console
#spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect

# Query Performance Monitoring
spring.jpa.properties.hibernate.generate_statistics=false
spring.jpa.properties.hibernate.session.events.log.LOG_QUERIES_SLOWER_THAN_MS=300

# Entity Scan Configuration
spring.data.jpa.repositories.base-package=com.example.gradlemedium100.dataaccess.repository
spring.data.jpa.entities.base-package=com.example.gradlemedium100.dataaccess.model

# Database Health Check Parameters
management.health.db.enabled=true
management.health.db.timeout=5000

# JDBC Template Configuration
spring.jdbc.template.fetch-size=100
spring.jdbc.template.max-rows=500

