plugins {
    id 'java-library'
    id 'org.springframework.boot' version '2.7.17'
    id 'io.spring.dependency-management' version '1.0.15.RELEASE'
    id 'org.flywaydb.flyway' version '7.9.1' // Added Flyway plugin
}

description = 'Provides repository implementations and database entity models. Contains JPA repositories, database configuration, migration scripts, and entity mappings for the application\'s domain objects.'

bootJar {
    enabled = false
}

jar {
    enabled = true
    archiveClassifier = ''
}

java {
    sourceCompatibility = JavaVersion.VERSION_17
    targetCompatibility = JavaVersion.VERSION_17
}

repositories {
    mavenCentral()
}

dependencies {
    // Internal dependencies
    implementation project(':common')
    
    // Spring Data JPA
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    
    // JDBC
    implementation 'org.springframework.boot:spring-boot-starter-jdbc'
    
    // Database drivers
    runtimeOnly 'com.h2database:h2'
    runtimeOnly 'org.postgresql:postgresql'
    
    // Flyway database migrations
    implementation 'org.flywaydb:flyway-core'
    
    // JPA and Hibernate
    implementation 'javax.persistence:javax.persistence-api'
    implementation 'org.hibernate:hibernate-core'
    
    // Connection pooling
    implementation 'com.zaxxer:HikariCP'
    
    // Spring Boot Actuator for health indicators
    implementation 'org.springframework.boot:spring-boot-starter-actuator'
    
    // Test dependencies
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.junit.jupiter:junit-jupiter-api'
    testRuntimeOnly 'org.junit.jupiter:junit-jupiter-engine'
}

test {
    useJUnitPlatform()
}

tasks.withType(JavaCompile) {
    options.encoding = 'UTF-8'
}

// Set duplicatesStrategy for processResources task
processResources {
    duplicatesStrategy = DuplicatesStrategy.INCLUDE
}

// Create javadoc JAR
task javadocJar(type: Jar) {
    archiveClassifier = 'javadoc'
    from javadoc.destinationDir
}

// Create sources JAR
task sourcesJar(type: Jar) {
    archiveClassifier = 'sources'
    from sourceSets.main.allJava
}

artifacts {
    archives javadocJar
    archives sourcesJar
}

// Configure repository scanning
springBoot {
    mainClass = 'com.gradlemedium100.dataaccess.DataAccessApplication'
}

// Ensure resources are processed with the correct encoding
tasks.withType(ProcessResources) {
    duplicatesStrategy = DuplicatesStrategy.INCLUDE
    from(sourceSets.main.resources.srcDirs) {
        include '**/*.properties'
        include '**/*.yml'
        include '**/*.xml'
        filter {
            it.replace('${version}', project.version)
        }
    }
}

// Flyway configuration
flyway {
    baselineOnMigrate = true
    locations = ["classpath:db/migration"]
}