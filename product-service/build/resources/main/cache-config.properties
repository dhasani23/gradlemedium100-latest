# ===================================================================
# Product Service Cache Configuration
# ===================================================================
# Configuration for product caching strategies

# ===================================================================
# Global Cache Configuration
# ===================================================================
# Enable caching globally
cache.enabled=true
# Default time-to-live (TTL) in seconds for cached items
cache.default-ttl=600
# Default maximum idle time in seconds
cache.default-max-idle=300
# Maximum cache size in entries
cache.max-entries=1000

# ===================================================================
# Product Cache Configuration
# ===================================================================
# Product cache settings
product.cache.enabled=true
# Maximum number of product entries in cache
product.cache.max-size=500
# TTL for product cache in seconds (30 minutes)
product.cache.expiration=1800
# Whether to use weak references for products to help with memory management
product.cache.use-weak-references=true
# Preload frequently accessed products on startup
product.cache.preload-on-startup=true
# Key prefix for product caches
product.cache.key-prefix=product_
# Cache name for product repository
product.cache.name=products

# ===================================================================
# Category Cache Configuration
# ===================================================================
# Category cache settings
category.cache.enabled=true
# Maximum number of category entries in cache
category.cache.max-size=100
# TTL for category cache in seconds (1 hour)
category.cache.expiration=3600
# Preload all categories on startup since the total count is typically small
category.cache.preload-on-startup=true
# Key prefix for category caches
category.cache.key-prefix=category_
# Cache name for category repository
category.cache.name=categories

# ===================================================================
# Inventory Cache Configuration
# ===================================================================
# Inventory cache settings - shorter TTL due to frequent updates
inventory.cache.enabled=true
# Maximum number of inventory entries in cache
inventory.cache.max-size=300
# TTL for inventory cache in seconds (2 minutes)
inventory.cache.expiration=120
# Do not preload inventory entries as they change frequently
inventory.cache.preload-on-startup=false
# Key prefix for inventory caches
inventory.cache.key-prefix=inventory_
# Cache name for inventory repository
inventory.cache.name=inventories

# ===================================================================
# Search Results Cache Configuration
# ===================================================================
# Cache settings for product search results
search.cache.enabled=true
# Maximum number of search result sets to cache
search.cache.max-size=100
# TTL for search cache in seconds (5 minutes)
search.cache.expiration=300
# Maximum size of each search result set to cache
search.cache.max-results-per-query=50
# Key prefix for search result caches
search.cache.key-prefix=search_
# Cache name for search results
search.cache.name=searchResults

# ===================================================================
# Cache Statistics & Monitoring
# ===================================================================
# Enable collection of cache statistics
cache.statistics.enabled=true
# Log cache statistics interval in seconds
cache.statistics.log-interval=300
# Enable JMX monitoring for caches
cache.jmx-monitoring.enabled=true

# ===================================================================
# Cache Refresh & Maintenance
# ===================================================================
# Enable background refresh for almost-expired entries
cache.refresh.enabled=true
# Percentage of TTL at which background refresh should occur (e.g. 80% of TTL)
cache.refresh.threshold-percentage=80
# Maximum concurrent refresh operations
cache.refresh.max-concurrent=5
# Cache maintenance interval in seconds
cache.maintenance.interval=60

# ===================================================================
# Cache Eviction Policies
# ===================================================================
# Eviction policy (LRU, LFU, or FIFO)
cache.eviction.policy=LRU
# Eviction threshold percentage (eviction starts when cache reaches this % of max size)
cache.eviction.threshold=95
# Eviction batch size (number of entries to evict at once)
cache.eviction.batch-size=10

