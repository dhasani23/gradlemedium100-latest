# ===================================================================
# Product Service Application Properties
# ===================================================================
# Configuration properties for the ProductService module 

# ===================================================================
# Spring Application Configuration
# ===================================================================
spring.application.name=product-service
server.port=8082
server.servlet.context-path=/api/products

# Include other configuration profiles
spring.profiles.include=dataaccess,security

# ===================================================================
# Database Connection (Inherits most settings from data-access module)
# ===================================================================
# Override specific database settings for product service if needed
spring.jpa.properties.hibernate.default_schema=product

# ===================================================================
# Caching Configuration
# ===================================================================
# Enable caching
spring.cache.type=caffeine
# Default cache TTL
spring.cache.caffeine.spec=maximumSize=500,expireAfterWrite=600s

# Product cache settings
product.cache.enabled=true
product.cache.max-size=200
product.cache.expire-after-write=300
# Category cache settings 
category.cache.enabled=true
category.cache.max-size=50
category.cache.expire-after-write=1800
# Inventory cache settings - shorter expiry due to frequent updates
inventory.cache.enabled=true
inventory.cache.max-size=100
inventory.cache.expire-after-write=60

# ===================================================================
# REST API Configuration
# ===================================================================
# Pagination defaults
api.pagination.default-page-size=20
api.pagination.max-page-size=100

# ===================================================================
# Inventory Configuration
# ===================================================================
# Threshold for low stock alerts
inventory.low-stock-threshold=10
# Enable inventory notifications
inventory.notifications.enabled=true
# Enable auto-reorder for low stock items
inventory.auto-reorder.enabled=false

# ===================================================================
# Product Configuration
# ===================================================================
# Maximum image size for product images (in KB)
product.image.max-size=1024
# Supported image formats
product.image.formats=jpg,jpeg,png,webp
# Default product sort field
product.default-sort-field=name
# Product search features
product.search.fuzzy-search-enabled=true
product.search.min-query-length=3

# ===================================================================
# Category Configuration
# ===================================================================
# Maximum nesting level for categories
category.max-nesting-level=3
# Allow products in parent categories
category.allow-products-in-parent=true

# ===================================================================
# Logging Configuration
# ===================================================================
# Enable debug logging for the product service
logging.level.com.gradlemedium100.productservice=INFO
# Log cache operations
logging.level.org.springframework.cache=INFO

# ===================================================================
# Management & Monitoring
# ===================================================================
# Enable metrics for product operations
management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.show-details=when_authorized
management.health.defaults.enabled=true

# ===================================================================
# Integration Configuration
# ===================================================================
# External product catalog API endpoint (for synchronization)
external.product-catalog.api.url=https://api.external-catalog.example.com/v1
external.product-catalog.api.enabled=false
external.product-catalog.sync.cron=0 0 2 * * ?

# ===================================================================
# Development Settings (disable in production)
# ===================================================================
# Enable initialization of sample data
product.sample-data.enabled=true
# Number of sample products to generate
product.sample-data.count=50

